# Проверка при каждом изменении.
#
# Только то, что не требует хоста владельца: тесты, которым нужны bubblewrap,
# systemd или живая модель, здесь не запускаются и не притворяются пройденными.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - name: Статические проверки
        run: go vet ./cmd/... ./internal/...

      - name: Тесты с детектором гонок
        run: go test -race ./cmd/... ./internal/...

      - name: Сборка
        run: go build -o bin/barrymored ./cmd/barrymored

      - name: Разбор интерфейса
        run: node --check internal/api/web/app.js
