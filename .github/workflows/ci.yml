# Проверка при каждом изменении.
#
# Тесты не требуют хоста владельца, но часть контура делегирования намеренно
# проверяет настоящую read-only изоляцию. Поэтому CI ставит bubblewrap вместо
# того, чтобы ослаблять тесты или притворяться, что просьбы исполнителю
# «ничего не менять» достаточно.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Изоляция для тестов
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - name: Статические проверки
        run: go vet ./cmd/... ./internal/...

      - name: Тесты с детектором гонок
        run: go test -race ./cmd/... ./internal/...

      - name: Сборка
        run: go build -o bin/barrymored ./cmd/barrymored

      - name: Разбор интерфейса
        run: node --check internal/api/web/app.js

      # Браузерная проверка проходит и без исполнителей на машине: часть про
      # поручение честно пропускается, а не считается пройденной молча.
      - name: Интерфейс в настоящем браузере
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node e2e/reception.mjs
