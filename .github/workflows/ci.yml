# Проверка при каждом изменении.
#
# CI не устанавливает системные пакеты из сети: доступность apt-зеркал не
# должна решать, зелёный ли код. Тесты, которым нужна настоящая kernel-level
# изоляция через bubblewrap, сами проверяют capability и честно пропускаются,
# если GitHub-hosted runner её не предоставляет. На реальном хосте они
# продолжают выполняться полностью.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - name: Статические проверки
        run: go vet ./cmd/... ./internal/...

      - name: Тесты с детектором гонок
        run: go test -race ./cmd/... ./internal/...

      - name: Сборка
        run: go build -o bin/barrymored ./cmd/barrymored

      - name: Разбор интерфейса
        run: |
          node --check internal/api/web/app.js
          node --check internal/api/web/surface.js
          node --check internal/api/web/desk.js
          node --check internal/api/web/proxy.js

      # Браузерная проверка проходит и без исполнителей на машине: часть про
      # поручение честно пропускается, а не считается пройденной молча.
      - name: Интерфейс в настоящем браузере
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
          node e2e/reception.mjs
